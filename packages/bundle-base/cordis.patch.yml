# zcd-base: ZCD capability rows over dsh-base.
#
# A bundle patch is ONE insert over the profile root; later bundles and the
# user's own cordis.patch.yml address these rows by id, last write winning.
# Keep every row individually disableable so an operator can turn one feature
# off without dropping the whole product layer.

- insert:
    # Deferred-tool seam: keeps rare tools out of every step until loaded.
    - id: zcd-deferred-tools
      name: '@zcd/deferred-tools'

    # Deferred-tool catalog. `deferred` is deployment-owned: it lists the tool
    # names the model may load; empty means no catalog yet.
    - id: zcd-tool-search
      name: '@zcd/tool-search'
      config:
        deferred: []
        maxResults: 8

    # Idle-time execution: queue a prompt for when the workspace is idle.
    - id: zcd-offpeak
      name: '@zcd/offpeak'
      config:
        idleMinutes: 10
        pollIntervalMs: 30000
        maxConcurrentTasks: 2

    - id: zcd-tool-offpeak
      name: '@zcd/tool-offpeak'

    # Office generation: create_document (docx/xlsx/pdf).
    - id: zcd-tool-office
      name: '@zcd/tool-office'

    # dsh-native Office authoring skills (router + docx/pptx/xlsx/render/
    # recalculate/export-pdf). Uses the pinned LibreOffice kit, not a ZCode fork.
    - id: zcd-skill-office
      name: '@deepseek-ai/dsh-skill-office'

    # Browser automation v1: one headless Chrome, one page per session.
    - id: zcd-browser
      name: '@zcd/browser'
      config:
        headless: true
        timeoutMs: 15000

    - id: zcd-tool-browser
      name: '@zcd/tool-browser'

    # Session-owned document view state (get_view).
    - id: zcd-document-view
      name: '@zcd/document-view'

    # Office/text document extraction (read_document / search_document).
    - id: zcd-tool-documents
      name: '@zcd/tool-documents'

    # Gen UI: sandboxed HTML artifacts served by the host route.
    - id: zcd-genui-host
      name: '@zcd/genui-host'

    - id: zcd-tool-visualize
      name: '@zcd/tool-visualize'

    # Durable workflow (MVP): replayable script runs with per-node caching.
    - id: zcd-durable-workflow
      name: '@zcd/durable-workflow'
      config:
        maxNodes: 100
        nodeTimeoutMs: 1800000

    - id: zcd-tool-workflow
      name: '@zcd/tool-workflow'

    # Long-term memory: project/user Markdown entries + generated index.
    - id: zcd-memory
      name: '@zcd/memory'
      config:
        maxEntryBytes: 65536
        maxEntries: 500
        directoryName: '.zcd/memory'

    - id: zcd-tool-memory
      name: '@zcd/tool-memory'

    # Cross-session handoff (deferred): bounded context from an earlier session.
    - id: zcd-tool-session
      name: '@zcd/tool-session'
      config:
        maxMessages: 20
        maxChars: 20000

    # Model catalog (deferred): pick a route without guessing.
    - id: zcd-tool-models
      name: '@zcd/tool-models'

    # Tool-shaped entry into plan mode (dsh exposes only the exit tool).
    - id: zcd-tool-plan-mode
      name: '@zcd/tool-plan-mode'

    # Read the current todo list without changing it.
    - id: zcd-tool-todo-read
      name: '@zcd/tool-todo-read'

    # ZCode-style strict plan mode: read-only tools stay available, mutating
    # tools are denied until the plan is approved. Off by default because dsh's
    # own plan mode is deliberately non-restrictive; enable per deployment.
    - id: zcd-policy-plan-readonly
      name: '@zcd/policy-plan-readonly'
      disabled: true
      config:
        classifyBash: true

# zcd-base: ZCD capability rows over dsh-base.
#
# A bundle patch is ONE insert over the profile root; later bundles and the
# user's own cordis.patch.yml address these rows by id, last write winning.
# Keep every row individually disableable so an operator can turn one feature
# off without dropping the whole product layer.

- insert:
    # Deferred-tool seam: keeps rare tools out of every step until loaded.
    - id: zcd-deferred-tools
      name: '@zcd/deferred-tools'

    # Deferred-tool catalog. `deferred` is deployment-owned: it lists the tool
    # names the model may load; empty means no catalog yet.
    - id: zcd-tool-search
      name: '@zcd/tool-search'
      config:
        deferred: []
        maxResults: 8

    # Idle-time execution: queue a prompt for when the workspace is idle.
    - id: zcd-offpeak
      name: '@zcd/offpeak'
      config:
        idleMinutes: 10
        pollIntervalMs: 30000
        maxConcurrentTasks: 2

    - id: zcd-tool-offpeak
      name: '@zcd/tool-offpeak'

    # Cross-session handoff (deferred): bounded context from an earlier session.
    - id: zcd-tool-session
      name: '@zcd/tool-session'
      config:
        maxMessages: 20
        maxChars: 20000

    # Model catalog (deferred): pick a route without guessing.
    - id: zcd-tool-models
      name: '@zcd/tool-models'

    # Tool-shaped entry into plan mode (dsh exposes only the exit tool).
    - id: zcd-tool-plan-mode
      name: '@zcd/tool-plan-mode'

    # Read the current todo list without changing it.
    - id: zcd-tool-todo-read
      name: '@zcd/tool-todo-read'

    # ZCode-style strict plan mode: read-only tools stay available, mutating
    # tools are denied until the plan is approved. Off by default because dsh's
    # own plan mode is deliberately non-restrictive; enable per deployment.
    - id: zcd-policy-plan-readonly
      name: '@zcd/policy-plan-readonly'
      disabled: true
      config:
        classifyBash: true

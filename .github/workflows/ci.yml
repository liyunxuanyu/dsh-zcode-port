name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify
      - run: pnpm build
      - run: node scripts/pack-product.mjs
      - run: pnpm doctor
      - run: node scripts/link-profile.mjs
        env:
          ZCD_DSH_HOME: ${{ github.workspace }}/.dsh-home
      - run: node scripts/smoke-profile.mjs
        env:
          ZCD_DSH_HOME: ${{ github.workspace }}/.dsh-home
      - uses: actions/upload-artifact@v4
        with:
          name: zcd-product
          path: dist/*.tgz
          if-no-files-found: error
